name: lingua
description: Language AI client architecture foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

workspace:
  - packages/lingua_auth
  - packages/lingua_design_system
  - packages/lingua_networking

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  lingua_auth: ^0.1.0
  lingua_design_system: ^0.1.0
  lingua_networking: ^0.1.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.5.0
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
